name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        # The source label links the published image to this repository on GitHub.
        run: docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t library-app .

      - name: Save the image to a file
        run: docker save library-app -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  scan:
    name: Security scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: library-app
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  smoke-test:
    name: Smoke test
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      - name: Start the app and database
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Check /health
        run: curl -fsS http://localhost:8000/health

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load the image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push the image
        run: |
          # ghcr.io only accepts lowercase names, so lowercase owner/repo.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag library-app "$IMAGE:latest"
          docker tag library-app "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
