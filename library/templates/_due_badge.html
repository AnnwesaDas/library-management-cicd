{% if book.is_overdue %}
<span class="badge badge-danger">Overdue {{ -book.days_left }} day{{ '' if -book.days_left == 1 else 's' }}</span>
{% elif book.days_left == 0 %}
<span class="badge badge-warning">Due today</span>
{% else %}
<span class="badge badge-info">Due {{ book.due_at.strftime('%d %b') }}</span>
{% endif %}
